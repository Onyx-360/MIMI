<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mimi-360 · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500&family=Fira+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#8F9AE0;--wash:rgba(102,110,169,.22)}
html,body{height:100%;background:#0B0B0F;color:#E8EAF6;font-family:'Fira Sans','DM Sans',system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-rows:58px 1fr 92px}
.bar{display:flex;align-items:center;gap:20px;padding:0 24px;background:#16151F;border-bottom:2px solid #666EA9;transition:border-color .6s}
.bar .t{font:400 26px 'Anton',Impact,sans-serif;letter-spacing:1px;color:#fff}
.bar .t span{color:var(--accent);transition:color .6s}
.live{display:flex;align-items:center;gap:7px;font:600 12px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;letter-spacing:2px;color:#5CF2A4}
.live i{width:9px;height:9px;border-radius:50%;background:#5CF2A4;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.bar .sp{flex:1}
.state-chip{font:700 13px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;padding:6px 12px;border-radius:4px;background:#5CF2A4;color:#0B0B0F;transition:background .4s}
.clk{font:500 14px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;color:#8F9AE0}
.bar img{height:32px}
.main{display:grid;grid-template-columns:1fr 400px;min-height:0}
.stage{position:relative;overflow:hidden;background:#0B0B0F}
.stage::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(143,154,224,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(143,154,224,.05) 1px,transparent 1px);background-size:24px 24px}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,var(--wash),transparent 60%);transition:background 1s}
.flash{position:absolute;inset:0;background:#FF5C7A;opacity:0;pointer-events:none}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.alarmFrame{position:absolute;inset:0;border:6px solid #F59E0B;opacity:0;pointer-events:none}
.s-alarm .alarmFrame{animation:blinkF 1s steps(2) infinite}
@keyframes blinkF{0%{opacity:.9}50%{opacity:0}}
.banner{position:absolute;left:50%;top:22px;transform:translate(-50%,-30px);opacity:0;font:400 30px 'Anton',Impact,sans-serif;letter-spacing:2px;padding:8px 22px;border-radius:6px;transition:all .45s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.banner.on{transform:translate(-50%,0);opacity:1}
#mimiWrap{position:absolute;left:50%;top:54%;width:min(88vh,900px,92%);transform:translate(-50%,-50%);cursor:pointer}
#mimiWrap svg{width:100%;overflow:visible;display:block}
.hint{position:absolute;left:24px;bottom:16px;font:400 13px 'DM Sans',sans-serif;color:#6E7299}
.side{background:#121119;border-left:1.5px solid #2C2D42;display:flex;flex-direction:column;min-height:0}
.panel{padding:16px 18px;border-bottom:1.5px solid #2C2D42}
.panel h3{font:700 12px 'Fira Sans',sans-serif;letter-spacing:2.5px;color:var(--accent);margin-bottom:10px;transition:color .6s}
#trend{width:100%;height:150px;display:block}
.log{flex:1;overflow:hidden;padding:16px 18px;min-height:0}
.log ul{list-style:none;font:400 13px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace}
.log li{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid #1E1E2C;animation:slide .4s ease-out}
.log li b{font-weight:700}
@keyframes slide{from{opacity:0;transform:translateX(20px)}}
.quip{font:400 26px 'Anton',Impact,sans-serif;line-height:1.15;color:#fff;letter-spacing:.5px;min-height:62px}
.quip span{color:var(--accent);transition:color .6s}
.ctrl{display:flex;align-items:center;gap:10px;padding:0 20px;background:#16151F;border-top:1.5px solid #2C2D42}
.btn{flex:1;height:62px;border-radius:8px;border:1.5px solid #2C2D42;background:#1B1B2A;color:#E8EAF6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .15s,background .3s,border-color .3s}
.btn:hover{transform:translateY(-2px);border-color:#666EA9}
.btn b{font:700 13px 'Fira Sans',sans-serif;letter-spacing:1.5px}
.btn small{font:400 11px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;color:#8890BE}
.btn .d{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.btn.act{background:#262645;border-color:var(--c)}
.auto{flex:0 0 150px;background:#343059;border-color:#666EA9}
.auto.on{background:#5A63A0}


.mode{display:flex;background:#0B0B0F;border:1.5px solid #2C2D42;border-radius:8px;padding:3px;gap:3px}
.mode button{border:0;background:transparent;color:#8890BE;font:700 12px 'Fira Sans',sans-serif;letter-spacing:1.5px;padding:7px 12px;border-radius:5px;cursor:pointer}
.mode button.on{background:#343059;color:#fff}
.note{display:none;position:absolute;right:20px;bottom:16px;font:400 12px 'JetBrains Mono',ui-monospace,monospace;color:#6E7299}
/* drop (new data) visual */
#mimi.s-drop{--line:#7CC4FF;--spot:#BFE3FF}
#mimi.s-drop .m-o{opacity:1}
#mimi.s-drop .whole{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
#mimi.s-drop .bang{opacity:1;transform:scale(1)}
#mimi .bang path{fill:var(--bang,#FF5C7A)}
#mimi.s-drop{--bang:#7CC4FF}
@media (max-width:820px){
 .app{grid-template-rows:auto 1fr auto}
 .bar{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
 .bar .t{font-size:20px}
 .live,.clk,.bar .sp{display:none}
 .bar img{height:24px;margin-left:auto}
 .mode{order:5;width:100%}.mode button{flex:1}
 .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
 #mimiWrap{width:94%;top:50%}
 .banner,.mt{display:none}
 .hint,.note{display:none!important}
 .side{border-left:0;border-top:1.5px solid #2C2D42}
 .side .panel:first-child,.log{display:none}
 .panel{padding:10px 14px}.quip{font-size:20px;min-height:48px}
 .ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
 .btn{height:52px}.btn small{display:none}
 .auto{grid-column:span 3;height:40px}
}


/* ===== v3 front-pose Mimi ===== */
#mimiWrap{width:min(64vh,600px,86%)!important;top:54%!important;cursor:crosshair}
.stage{cursor:crosshair}
@media (max-width:820px){#mimiWrap{width:min(72%,44vh)!important;top:55%!important}}
.char{--body:#1C1D2B;--body2:#2A2C44;--belly:#4A4F7A;--line:#6E79B7;--spot:#A9B2F0;--hat:#F3F4FA;--hatline:#262645;--white:#fff;--pupil:#11131A;--mouth:#EEF0FA;--grid:0;--facet:1;--shine:1;--cheek:1}
.char .skin{fill:var(--body);stroke:var(--line);stroke-width:4.5}
.char .skin2{fill:var(--body2);stroke:var(--line);stroke-width:4.5}
.char .outline{stroke:var(--line)}
.char .inner{stroke:var(--body)}
.char .bel{fill:var(--belly)}
.char .spot{fill:var(--spot)}
.char .spotl{stroke:var(--spot)}
.char .hatF{fill:var(--hat);stroke:var(--hatline)}
.char .eyeW{fill:var(--white)}
.char .pup{fill:var(--pupil)}
.char .mouthS{stroke:var(--mouth)}
.char .gridO{opacity:var(--grid)}
.char .iri{opacity:calc(var(--facet) * .5)}
.char .glint{opacity:var(--facet)}
.char .shineG{opacity:var(--shine)}
.char .cheek{fill:#FF8FAB;opacity:calc(var(--cheek) * .85)}
.char .logoM{opacity:1}
.char.s-tuned{--spot:#D2D8FF;--body:#20223A}
.char.s-trip{--line:#FF5C7A;--body:#26161F;--body2:#3A2030;--belly:#4A2A3A;--spot:#FF8FA3}
.char.s-noconv{--body:#3B4A63;--body2:#4A5B78;--belly:#64748B;--line:#9DB4D6;--spot:#93C5FD;--shine:0}
.char.s-alarm{--body:#F59E0B;--body2:#FBBF24;--belly:#FDE68A;--line:#7A4A00;--spot:#FFFFFF;--mouth:#7A4A00;--facet:.35;--hatline:#7A4A00}
.char.s-sim{--body:#15162B;--body2:#1E2040;--belly:rgba(169,178,240,.16);--line:#A9B2F0;--spot:#A9B2F0;--hat:rgba(169,178,240,.10);--hatline:#A9B2F0;--white:rgba(169,178,240,.14);--pupil:#A9B2F0;--grid:1;--facet:0;--shine:0;--cheek:0}
.char.s-sim .logoM{opacity:0}
.char.s-drop{--line:#7CC4FF;--spot:#BFE3FF;--body:#18202E;--body2:#22304A}
/* faces */
.char .m{opacity:0}
.char.s-normal .m-smile,.char.s-tuned .m-smile,.char.s-sim .m-smile{opacity:1}
.char.s-trip .m-o,.char.s-drop .m-o{opacity:1}
.char.s-noconv .m-frown{opacity:1}
.char.s-alarm .m-grit{opacity:1}
.char .tng{opacity:0}.char.s-normal .tng,.char.s-tuned .tng{opacity:1}
.char .sadlid{opacity:0}.char.s-noconv .sadlid{opacity:1}
.char .brow{opacity:0}.char.s-alarm .brow{opacity:1}
.char .winkArc{opacity:0}.char.s-tuned .winkArc{opacity:1}.char.s-tuned .eR .open{opacity:0}
.char .tear,.char .sweat{opacity:0}
.char.s-noconv .tear{animation:drip 1.6s ease-in infinite}
.char.s-alarm .sweat{animation:drip 1.1s ease-in infinite}
@keyframes drip{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(40px)}}
/* motion (root) */
#mimi .whole{transform-origin:200px 392px}
#mimi .breath{transform-origin:200px 380px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.982)}}
#mimi .tailG{transform-origin:270px 300px;animation:tailw 4s ease-in-out infinite}
@keyframes tailw{50%{transform:rotate(7deg)}}
#mimi .headPose{transform-origin:200px 270px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#mimi .headG{transform-origin:200px 270px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1.2deg)}}
#mimi.m-noconv .headPose{transform:rotate(6deg) translateY(10px)}
#mimi.m-tuned .headPose{transform:rotate(-5deg)}
#mimi.m-alarm .breath{animation:shake .18s linear infinite}
#mimi.m-alarm .tailG{animation:tailw .35s ease-in-out infinite}
@keyframes shake{25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
#mimi.m-trip .whole,#mimi.m-drop .whole{animation:jump .85s cubic-bezier(.3,1.2,.5,1)}
@keyframes jump{0%{transform:none}15%{transform:translateY(5px) scale(1.09,.88)}42%{transform:translateY(-52px) scale(.93,1.1)}68%{transform:translateY(0) scale(1.12,.88)}84%{transform:scale(.96,1.04)}100%{transform:none}}
#mimi.m-trip .pipe{animation:rattle .07s linear 9}
@keyframes rattle{25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
#mimi .spotc{animation:twinkle 2.4s ease-in-out infinite}
#mimi.m-sim .spotc{animation-duration:.6s}
@keyframes twinkle{50%{opacity:.35}}
#mimi .shineB{animation:shine 5.5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-200px)}55%,100%{transform:translateX(420px)}}
#mimi .blinkLid{transform:scaleY(0);transform-box:fill-box;transform-origin:top;transition:transform .08s}
#mimi.blinking .blinkLid{transform:scaleY(1)}
#mimi.gulp .cheek{transform-box:fill-box;transform-origin:center;animation:puff .35s ease-out}
@keyframes puff{40%{transform:scale(1.6,1.4)}}
#mimi.blush .cheek{fill:#FF4F82}
/* fx */
#mimi .fx{opacity:0;transition:opacity .3s}
#mimi.m-alarm .warn{opacity:1;animation:bobfx .5s ease-in-out infinite alternate}
@keyframes bobfx{to{transform:translateY(-6px)}}
#mimi .bang{transform-origin:330px 40px;transform:scale(.2);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
#mimi.m-trip .bang,#mimi.m-drop .bang{opacity:1;transform:scale(1)}
#mimi .bang path{fill:#FF5C7A}#mimi.m-drop .bang path{fill:#7CC4FF}
#mimi .spark{transform-box:fill-box;transform-origin:center}
#mimi.m-tuned .sparks{opacity:1}
#mimi.m-tuned .spark{animation:sparkle 1.4s ease-in-out infinite}
#mimi.m-tuned .spark:nth-child(2){animation-delay:.45s}#mimi.m-tuned .spark:nth-child(3){animation-delay:.9s}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
#mimi.m-noconv .cloud{opacity:1}
#mimi .cloud{transform:translateY(-16px);transition:all .5s}#mimi.m-noconv .cloud{transform:none}
#mimi.m-noconv .drop{animation:rain 1s linear infinite}
#mimi.m-noconv .drop:nth-child(2){animation-delay:.33s}#mimi.m-noconv .drop:nth-child(3){animation-delay:.66s}
#mimi .drop{opacity:0}
@keyframes rain{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(36px)}}
#mimi.m-sim .scanG{opacity:1}
#mimi .scan{animation:scan 2.2s linear infinite}
@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(420px)}}
#mimi.m-sim .simTxt{opacity:1;animation:pulse 1s infinite}
#mimi .pipeF{fill:#2E2E3A;stroke:#55556A;transition:all .6s}
#mimi.m-sim .pipeF{fill:transparent;stroke:#A9B2F0;stroke-dasharray:6 5}
#mimi .wing{transform-box:fill-box;transform-origin:bottom center;animation:flap .06s linear infinite alternate}
@keyframes flap{to{transform:scaleY(.3)}}

</style></head>

 const L=tp.getTotalLength();[tp,th].forEach(e=>{e.style.strokeDasharray=L;e.style.strokeDashoffset=L});tg.style.display='';
 const at=l=>tp.getPointAtLength(Math.max(0,Math.min(L,l)));
 await tween(150,p=>{const l=L*p;[tp,th].forEach(e=>e.style.strokeDashoffset=L-l);const q=at(l);tt.setAttribute('cx',q.x);tt.setAttribute('cy',q.y)});
 await sleep(70);
 await tween(240,p=>{const e=p*p;const l=L*(1-e);[tp,th].forEach(el=>el.style.strokeDashoffset=L-l);const q=at(l);tt.setAttribute('cx',q.x);tt.setAttribute('cy',q.y);setPrey(q.x,q.y,0,1-.6*e)});
 tg.style.display='none';prey.style.display='none';zapT=null;
 mimi.classList.add('gulp');setTimeout(()=>mimi.classList.remove('gulp'),380);busy=false;
}
// idle blep
async function blep(){ if(!busy&&(curVis==='normal'||curVis==='tuned')){busy=true;const M={x:200,y:244};const d=`M200 244 Q200 262 200 272`;tp.setAttribute('d',d);th.setAttribute('d',d);const L=tp.getTotalLength();[tp,th].forEach(e=>{e.style.strokeDasharray=L});tg.style.display='';
 await tween(120,p=>{[tp,th].forEach(e=>e.style.strokeDashoffset=L*(1-p));const q=tp.getPointAtLength(L*p);tt.setAttribute('cx',q.x);tt.setAttribute('cy',q.y)});await sleep(240);
 await tween(140,p=>{[tp,th].forEach(e=>e.style.strokeDashoffset=L*p);const q=tp.getPointAtLength(L*(1-p));tt.setAttribute('cx',q.x);tt.setAttribute('cy',q.y)});tg.style.display='none';busy=false}
 setTimeout(blep,9000+Math.random()*6000)}

/* ================= turret eyes ================= */
let mouse=null,cur={L:[0,0],R:[0,0]},wand={L:[0,0],R:[0,0]},wt=0;
function toSvg(x,y){const p=mimi.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(mimi.getScreenCTM().inverse())}
document.addEventListener('mousemove',e=>{mouse=[e.clientX,e.clientY]});
document.addEventListener('touchstart',e=>{const t=e.touches[0];mouse=[t.clientX,t.clientY]},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];mouse=[t.clientX,t.clientY]},{passive:true});
function aim(eye,pt,max=13){const [ex,ey]=EL[eye];const dx=pt.x-ex,dy=pt.y-ey,m=Math.hypot(dx,dy)||1;const k=Math.min(1,m/60)*max;return [dx/m*k,dy/m*k]}
const turs={L:[...document.querySelectorAll('.turL')],R:[...document.querySelectorAll('.turR')]},pups={L:[...document.querySelectorAll('.pupL')],R:[...document.querySelectorAll('.pupR')]};
function eyes(t){
 let tgt;
 if(zapT){tgt={L:aim('L',zapT),R:aim('R',zapT)}}
 else{const lock={trip:[0,0],drop:[0,-2],alarm:[0,0],noconv:[-2,8]}[curVis];
  if(t-wt>(1200+Math.random()*1400)){wt=t;const big=Math.random()<.35;const a=Math.random()*Math.PI*2,r=big?13:6+Math.random()*4;wand.R=[Math.cos(a)*r,Math.sin(a)*r*.8];const a2=Math.random()*Math.PI*2;wand.L=[Math.cos(a2)*6,Math.sin(a2)*4]}
  if(lock)tgt={L:lock,R:lock};else tgt={L:mouse?aim('L',toSvg(mouse[0],mouse[1])):wand.L,R:wand.R}}
 for(const s of ['L','R']){const c=cur[s];c[0]+=(tgt[s][0]-c[0])*.2;c[1]+=(tgt[s][1]-c[1])*.2;const [ex,ey]=EL[s];
  const sx=1-Math.abs(c[0])/55,sy=1-Math.abs(c[1])/55;
  turs[s].forEach(g=>g.setAttribute('transform',`translate(${ex+c[0]*.55} ${ey+c[1]*.55}) scale(${sx} ${sy}) translate(${-ex} ${-ey})`));
  pups[s].forEach(g=>g.setAttribute('transform',`translate(${c[0]*.5} ${c[1]*.5})`))}
 requestAnimationFrame(eyes)}

function pose(vis){curVis=vis;LA.setAttribute('class','char s-'+vis);LB.setAttribute('class','char s-'+vis);WC.setAttribute('r',0);setMotion(vis)}
/* ================= interactions ================= */
document.querySelector('.stage').addEventListener('click',async e=>{
 if(busy)return;const p=toSvg(e.clientX,e.clientY);
 const onMimi=Math.hypot(p.x-200,p.y-200)<120;
 if(onMimi){mimi.classList.add('blush');blink();setTimeout(()=>mimi.classList.remove('blush'),1200);log('Mimi got a head pat','#5CF2A4',1);return}
 const T={x:Math.max(-60,Math.min(460,p.x)),y:Math.max(-80,Math.min(420,p.y))};
 await zap(T,'bug',false);log('Bug eaten','#5CF2A4',1);
});
let autoT=null;
function startAuto(){auto.classList.add('on');auto.innerHTML='<b>❚❚ AUTO DEMO</b><small>cycles every 5 s</small>';clearInterval(autoT);autoT=setInterval(()=>setState((curI+1)%MODES[mode].items.length),5000)}
function stopAuto(){clearInterval(autoT);autoT=null;auto.classList.remove('on');auto.innerHTML='<b>▶ AUTO DEMO</b><small>cycles every 5 s</small>'}
auto.onclick=e=>{e.stopPropagation();autoT?stopAuto():startAuto()};
function setMode(m){mode=m;curI=-1;document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 document.getElementById('modeT').textContent=MODES[m].title;document.getElementById('trendT').textContent=MODES[m].trend;
 document.getElementById('note').style.display=m==='twinsync'?'block':'none';document.getElementById('simTxt').textContent=m==='twinsync'?'SYNCING…':'SIMULATING…';
 buildButtons();setState(0,true);if(autoT)startAuto();else stopAuto();try{history.replaceState(null,'',m==='twinsync'?'#simmetry':location.pathname)}catch(e){}}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function blinkLoop(){if(curVis!=='tuned'&&!busy)blink();setTimeout(blinkLoop,2200+Math.random()*2600)}

/* ================= trend ================= */
const cv=document.getElementById('trend'),cx=cv.getContext('2d');let pts=[],pv=80;
function sizeCv(){const r=cv.getBoundingClientRect();cv.width=Math.max(1,r.width*devicePixelRatio);cv.height=Math.max(1,r.height*devicePixelRatio)}
sizeCv();addEventListener('resize',sizeCv);
function draw(){
 const v=curVis;pv+=(target-pv)*0.05+(Math.random()-.5)*(v==='alarm'?5:v==='trip'?3:mode==='twinsync'?.4:1.2);pv=Math.min(100,pv);
 pts.push(pv);if(pts.length>160)pts.shift();
 const W=cv.width,H=cv.height,d=devicePixelRatio,sp=MODES[mode].sp;cx.clearRect(0,0,W,H);
 cx.strokeStyle='#2C2D42';cx.lineWidth=1*d;[0,.33,.66,1].forEach(f=>{cx.beginPath();cx.moveTo(0,4*d+f*(H-8*d));cx.lineTo(W,4*d+f*(H-8*d));cx.stroke()});
 const y=q=>6*d+(1-q/100)*(H-12*d);
 cx.setLineDash([6*d,5*d]);cx.strokeStyle='#5CF2A4';cx.beginPath();cx.moveTo(0,y(sp));cx.lineTo(W,y(sp));cx.stroke();cx.setLineDash(v==='sim'?[4*d,4*d]:[]);
 cx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#A9B2F0';cx.lineWidth=2.5*d;cx.beginPath();
 pts.forEach((p,i)=>{const X=W*(i/159);i?cx.lineTo(X,y(p)):cx.moveTo(X,y(p))});cx.stroke();cx.setLineDash([]);
 cx.fillStyle='#8890BE';cx.font=`${10*d}px monospace`;cx.fillText('SP',W-20*d,y(sp)+12*d);cx.fillText('PV '+pv.toFixed(0)+'%',6*d,H-6*d);
 setTimeout(()=>requestAnimationFrame(draw),60)}
for(let i=0;i<160;i++)pts.push(80+i*.08);
const tick=()=>document.getElementById('clk').textContent=new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(',','');tick();setInterval(tick,1000);

autoT=1;setMode(/^#(simmetry|twinsync)$/.test(location.hash)?'twinsync':'plant');startAuto();blinkLoop();requestAnimationFrame(eyes);draw();setTimeout(blep,6000);
addEventListener('hashchange',()=>{const m=/^#(simmetry|twinsync)$/.test(location.hash)?'twinsync':'plant';if(m!==mode)setMode(m)});
</script>
