<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mimi-360 · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500&family=Fira+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#8F9AE0;--wash:rgba(102,110,169,.22)}
html,body{height:100%;background:#0B0B0F;color:#E8EAF6;font-family:'Fira Sans','DM Sans',system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-rows:58px 1fr 92px}
.bar{display:flex;align-items:center;gap:20px;padding:0 24px;background:#16151F;border-bottom:2px solid #666EA9;transition:border-color .6s}
.bar .t{font:400 26px 'Anton',Impact,sans-serif;letter-spacing:1px;color:#fff}
.bar .t span{color:var(--accent);transition:color .6s}
.live{display:flex;align-items:center;gap:7px;font:600 12px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;letter-spacing:2px;color:#5CF2A4}
.live i{width:9px;height:9px;border-radius:50%;background:#5CF2A4;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.bar .sp{flex:1}
.state-chip{font:700 13px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;padding:6px 12px;border-radius:4px;background:#5CF2A4;color:#0B0B0F;transition:background .4s}
.clk{font:500 14px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;color:#8F9AE0}
.bar img{height:32px}
.main{display:grid;grid-template-columns:1fr 400px;min-height:0}
.stage{position:relative;overflow:hidden;background:#0B0B0F}
.stage::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(143,154,224,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(143,154,224,.05) 1px,transparent 1px);background-size:24px 24px}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,var(--wash),transparent 60%);transition:background 1s}
.flash{position:absolute;inset:0;background:#FF5C7A;opacity:0;pointer-events:none}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.alarmFrame{position:absolute;inset:0;border:6px solid #F59E0B;opacity:0;pointer-events:none}
.s-alarm .alarmFrame{animation:blinkF 1s steps(2) infinite}
@keyframes blinkF{0%{opacity:.9}50%{opacity:0}}
.banner{position:absolute;left:50%;top:22px;transform:translate(-50%,-30px);opacity:0;font:400 30px 'Anton',Impact,sans-serif;letter-spacing:2px;padding:8px 22px;border-radius:6px;transition:all .45s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.banner.on{transform:translate(-50%,0);opacity:1}
#mimiWrap{position:absolute;left:50%;top:54%;width:min(88vh,900px,92%);transform:translate(-50%,-50%);cursor:pointer}
#mimiWrap svg{width:100%;overflow:visible;display:block}
.hint{position:absolute;left:24px;bottom:16px;font:400 13px 'DM Sans',sans-serif;color:#6E7299}
.side{background:#121119;border-left:1.5px solid #2C2D42;display:flex;flex-direction:column;min-height:0}
.panel{padding:16px 18px;border-bottom:1.5px solid #2C2D42}
.panel h3{font:700 12px 'Fira Sans',sans-serif;letter-spacing:2.5px;color:var(--accent);margin-bottom:10px;transition:color .6s}
#trend{width:100%;height:150px;display:block}
.log{flex:1;overflow:hidden;padding:16px 18px;min-height:0}
.log ul{list-style:none;font:400 13px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace}
.log li{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid #1E1E2C;animation:slide .4s ease-out}
.log li b{font-weight:700}
@keyframes slide{from{opacity:0;transform:translateX(20px)}}
.quip{font:400 26px 'Anton',Impact,sans-serif;line-height:1.15;color:#fff;letter-spacing:.5px;min-height:62px}
.quip span{color:var(--accent);transition:color .6s}
.ctrl{display:flex;align-items:center;gap:10px;padding:0 20px;background:#16151F;border-top:1.5px solid #2C2D42}
.btn{flex:1;height:62px;border-radius:8px;border:1.5px solid #2C2D42;background:#1B1B2A;color:#E8EAF6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .15s,background .3s,border-color .3s}
.btn:hover{transform:translateY(-2px);border-color:#666EA9}
.btn b{font:700 13px 'Fira Sans',sans-serif;letter-spacing:1.5px}
.btn small{font:400 11px 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',monospace;color:#8890BE}
.btn .d{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.btn.act{background:#262645;border-color:var(--c)}
.auto{flex:0 0 150px;background:#343059;border-color:#666EA9}
.auto.on{background:#5A63A0}


.mode{display:flex;background:#0B0B0F;border:1.5px solid #2C2D42;border-radius:8px;padding:3px;gap:3px}
.mode button{border:0;background:transparent;color:#8890BE;font:700 12px 'Fira Sans',sans-serif;letter-spacing:1.5px;padding:7px 12px;border-radius:5px;cursor:pointer}
.mode button.on{background:#343059;color:#fff}
.note{display:none;position:absolute;right:20px;bottom:16px;font:400 12px 'JetBrains Mono',ui-monospace,monospace;color:#6E7299}
/* drop (new data) visual */
#mimi.s-drop{--line:#7CC4FF;--spot:#BFE3FF}
#mimi.s-drop .m-o{opacity:1}
#mimi.s-drop .whole{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
#mimi.s-drop .bang{opacity:1;transform:scale(1)}
#mimi .bang path{fill:var(--bang,#FF5C7A)}
#mimi.s-drop{--bang:#7CC4FF}
@media (max-width:820px){
 .app{grid-template-rows:auto 1fr auto}
 .bar{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
 .bar .t{font-size:20px}
 .live,.clk,.bar .sp{display:none}
 .bar img{height:24px;margin-left:auto}
 .mode{order:5;width:100%}.mode button{flex:1}
 .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
 #mimiWrap{width:94%;top:50%}
 .banner,.mt{display:none}
 .hint,.note{display:none!important}
 .side{border-left:0;border-top:1.5px solid #2C2D42}
 .side .panel:first-child,.log{display:none}
 .panel{padding:10px 14px}.quip{font-size:20px;min-height:48px}
 .ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
 .btn{height:52px}.btn small{display:none}
 .auto{grid-column:span 3;height:40px}
}

/* ====== Mimi SVG state styling ====== */
#mimi{--body:#1A1A22;--body2:#26263A;--belly:#34344A;--line:#666EA9;--spot:#8F9AE0;--hat:#F3F4FA;--hatline:#262645;--white:#fff;--pupil:#11131A;--mouth:#E9EDF3;--grid:0;--facet:1}
#mimi .skin{fill:var(--body);stroke:var(--line);stroke-width:4}
#mimi .skin2{fill:var(--body2);stroke:var(--line);stroke-width:4}
#mimi .outline{stroke:var(--line)}
#mimi .inner{stroke:var(--body)}
#mimi .bellyS{stroke:var(--belly)}
#mimi .spot{fill:var(--spot)}
#mimi .spotl{stroke:var(--spot)}
#mimi .hatF{fill:var(--hat);stroke:var(--hatline)}
#mimi .eyeW{fill:var(--white)}
#mimi .pup{fill:var(--pupil)}
#mimi .mouthS{stroke:var(--mouth)}
#mimi .gridO{opacity:var(--grid)}
#mimi .facets{opacity:var(--facet)}
#mimi *{transition:fill .7s ease,stroke .7s ease,opacity .45s ease,transform .45s cubic-bezier(.3,1.5,.5,1)}
#mimi .m{opacity:0}
#mimi.s-normal{}
#mimi.s-tuned{--spot:#B7C0FF;--body:#1C1D30}
#mimi.s-trip{--line:#FF5C7A;--body:#24161E;--body2:#3A2030;--spot:#FF8FA3}
#mimi.s-noconv{--body:#3B4A63;--body2:#4A5B78;--belly:#64748B;--line:#9DB4D6;--spot:#93C5FD}
#mimi.s-alarm{--body:#F59E0B;--body2:#FBBF24;--belly:#FCD34D;--line:#7A4A00;--spot:#FFFFFF;--mouth:#7A4A00;--facet:.5}
#mimi.s-sim{--body:#15162B;--body2:#1E2040;--belly:rgba(143,154,224,.35);--line:#8F9AE0;--spot:#8F9AE0;--hat:rgba(143,154,224,.12);--hatline:#8F9AE0;--white:rgba(143,154,224,.15);--pupil:#8F9AE0;--grid:1;--facet:0}
/* mouths per state */
#mimi.s-normal .m-smile,#mimi.s-tuned .m-smile,#mimi.s-sim .m-smile{opacity:1}
#mimi.s-trip .m-o{opacity:1}
#mimi.s-noconv .m-frown{opacity:1}
#mimi.s-alarm .m-grit{opacity:1}
#mimi .tongue{opacity:0}
#mimi.s-normal .tongue,#mimi.s-tuned .tongue{opacity:1}
/* lids */
#mimi .sadlid{opacity:0}
#mimi.s-noconv .sadlid{opacity:1}
#mimi .brow{opacity:0}
#mimi.s-alarm .brow{opacity:1}
#mimi .winkArc{opacity:0}
#mimi.s-tuned .winkArc{opacity:1}
#mimi.s-tuned .eyeR .open{opacity:0}
#mimi .tear{opacity:0}
#mimi.s-noconv .tear{animation:tear 1.6s ease-in infinite}
@keyframes tear{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(46px)}}
#mimi .sweat{opacity:0}
#mimi.s-alarm .sweat{animation:tear 1.1s ease-in infinite}
#mimi .cheek{fill:#FF8FAB;opacity:.75}
#mimi.s-sim .cheek{opacity:0}
#mimi.s-tuned .cheek{opacity:1}
#mimi.blush .cheek{opacity:1;fill:#FF5C8A}
/* body motions */
#mimi .breath{transform-origin:210px 290px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.018,.985)}}
#mimi .tailG{transform-origin:126px 236px;animation:tailw 4s ease-in-out infinite}
@keyframes tailw{50%{transform:rotate(-5deg)}}
#mimi.s-alarm .tailG{animation:tailw .4s ease-in-out infinite}
#mimi.s-alarm .breath{animation:shake .18s linear infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#mimi.s-trip .whole{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-38px) scale(.96,1.06)}60%{transform:translateY(0) scale(1.06,.94)}}
#mimi .whole{transform-origin:210px 300px}
#mimi .headG{transform-origin:300px 210px}
#mimi.s-noconv .headG{transform:rotate(7deg) translateY(6px)}
#mimi.s-tuned .headG{transform:rotate(-4deg)}
.spotc{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
#mimi.s-sim .spotc{animation:twinkle .6s ease-in-out infinite}
/* blink */
#mimi .blinkLid{transform:scaleY(0);transform-box:fill-box;transform-origin:top;transition:transform .09s}
#mimi.blinking .blinkLid{transform:scaleY(1)}
/* fx */
#mimi .warn{opacity:0;transform:translateY(10px)}
#mimi.s-alarm .warn{opacity:1;transform:none;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
#mimi .bang{opacity:0;transform-origin:396px 70px;transform:scale(.2)}
#mimi.s-trip .bang{opacity:1;transform:scale(1)}
#mimi .spark{opacity:0}
#mimi.s-tuned .spark{animation:sparkle 1.4s ease-in-out infinite}
#mimi.s-tuned .spark:nth-child(2){animation-delay:.45s}#mimi.s-tuned .spark:nth-child(3){animation-delay:.9s}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
#mimi .spark{transform-box:fill-box;transform-origin:center}
#mimi .cloud{opacity:0;transform:translateY(-20px)}
#mimi.s-noconv .cloud{opacity:1;transform:none}
#mimi .drop{opacity:0}
#mimi.s-noconv .drop{animation:rain 1s linear infinite}
#mimi.s-noconv .drop:nth-child(2){animation-delay:.33s}#mimi.s-noconv .drop:nth-child(3){animation-delay:.66s}
@keyframes rain{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(40px)}}
#mimi .scan{opacity:0}
#mimi.s-sim .scan{opacity:1;animation:scan 2.2s linear infinite}
@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(320px)}}
#mimi .simTxt{opacity:0}
#mimi.s-sim .simTxt{opacity:1;animation:pulse 1s infinite}
#mimi .pipeF{fill:#2E2E3A;stroke:#55556A}
#mimi.s-sim .pipeF{fill:transparent;stroke:#8F9AE0;stroke-dasharray:6 5}
</style></head>

 if(s.vis==='trip'||s.vis==='drop'){const w=mimi.querySelector('.whole');w.style.animation='none';void w.offsetWidth;w.style.animation=''}

  if(mouse){const r=mimi.getBoundingClientRect();const sc=r.width/420;const ex=r.left+288*sc,ey=r.top+182*sc;const dx=mouse[0]-ex,dy=mouse[1]-ey,m=Math.hypot(dx,dy)||1;l=[dx/m*8,dy/m*8]}else l=[Math.sin(t/900)*6,Math.cos(t/1300)*3];
  if(t-wt>1100){wt=t;const a=Math.random()*Math.PI*2;wander=[Math.cos(a)*7,Math.sin(a)*6]}}
 pL.style.transform=`translate(${l[0]}px,${l[1]}px)`;pR.style.transform=`translate(${wander[0]}px,${wander[1]}px)`;requestAnimationFrame(eyes)}
